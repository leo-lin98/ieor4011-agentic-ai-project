<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arb Dashboard</title>
<style>
  :root {
    --bg: #0f1216; --panel: #161b22; --line: #2a313b; --text: #e6e9ee; --muted: #8b949e;
    --kalshi: #2ecc71; --kalshi-bg: rgba(46, 204, 113, .10); --kalshi-line: rgba(46, 204, 113, .45);
    --poly: #4da3ff; --poly-bg: rgba(77, 163, 255, .10); --poly-line: rgba(77, 163, 255, .45);
    --same: #c9a227; --opp: #e06c75; --ok: #2ecc71;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  .tabs button { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .tabs button.on { color: var(--text); border-color: var(--text); }
  .counts { margin-left: auto; color: var(--muted); display: flex; gap: 14px; white-space: nowrap; }
  .k { color: var(--kalshi); font-weight: 600; } .p { color: var(--poly); font-weight: 600; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; align-items: center; border-bottom: 1px solid var(--line); }
  select, input[type=text] { background: #0b0e12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  input[type=text] { min-width: 260px; }
  label.chk { color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .bar .n { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .bar button { background: #0b0e12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 45px; background: var(--bg); z-index: 2; font-size: 12px; }
  tr.K td:first-child { border-left: 3px solid var(--kalshi); } tr.K { background: var(--kalshi-bg); }
  tr.P td:first-child { border-left: 3px solid var(--poly); }  tr.P { background: var(--poly-bg); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; border: 1px solid; }
  .pill.K { color: var(--kalshi); border-color: var(--kalshi-line); } .pill.P { color: var(--poly); border-color: var(--poly-line); }
  .pill.same { color: var(--same); border-color: var(--same); } .pill.opposite { color: var(--opp); border-color: var(--opp); }
  .pill.st { color: var(--muted); border-color: var(--line); }
  .muted { color: var(--muted); } .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .sub { color: var(--muted); font-size: 12px; }
  .pager { display: flex; gap: 8px; align-items: center; padding: 10px 16px; color: var(--muted); }
  .pager button { background: #0b0e12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  /* tab 2 split row */
  table.pairs td.side { width: 42%; }
  td.side.P { background: var(--poly-bg); border-left: 3px solid var(--poly); }
  td.side.K { background: var(--kalshi-bg); border-left: 3px solid var(--kalshi); }
  td.mid { width: 16%; text-align: center; color: var(--muted); }
  tr.pair { cursor: pointer; } tr.pair:hover td { filter: brightness(1.15); }
  tr.pair.sel td.mid { color: var(--text); }
  /* detail drawer */
  #drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(900px, 95vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 10; transform: translateX(100%); transition: transform .15s; overflow: auto; }
  #drawer.open { transform: none; }
  #drawer .hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
  #drawer .hd button { margin-left: auto; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .col { padding: 12px 16px; border-right: 1px solid var(--line); }
  .col h3 { margin: 0 0 6px; font-size: 13px; }
  .col.P h3 { color: var(--poly); } .col.K h3 { color: var(--kalshi); }
  .rules { white-space: pre-wrap; font-size: 12.5px; color: #c9d1d9; margin-top: 8px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0; font-size: 12px; }
  dt { color: var(--muted); } dd { margin: 0; }
  /* tab 3 judge */
  .pill.identical { color: var(--ok); border-color: var(--ok); } .pill.not_identical { color: var(--opp); border-color: var(--opp); }
  .pill.unsure { color: var(--same); border-color: var(--same); } .pill.not_judged { color: var(--muted); border-color: var(--line); }
  tr.jrow { cursor: pointer; } tr.jrow:hover td { filter: brightness(1.15); }
  tr.jrow td:first-child { color: var(--muted); width: 18px; }
  tr.jdetail td { background: var(--panel); padding: 14px 18px 18px; }
  .jd h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .jd .reason { white-space: pre-wrap; font-size: 13px; }
  .jd table.chk { width: 100%; margin-top: 4px; }
  .jd table.chk th { position: static; font-size: 11.5px; }
  .jd table.chk td { font-size: 12px; }
  .jd table.chk td.dim { white-space: nowrap; color: var(--text); }
  .jd table.chk td.same-yes { color: var(--ok); } .jd table.chk td.same-no { color: var(--opp); } .jd table.chk td.same-unsure { color: var(--same); }
  .jd .rb { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .jd .rb > div { font-size: 12px; white-space: pre-wrap; color: #c9d1d9; padding: 10px; border: 1px solid var(--line); border-radius: 6px; }
  .jd .rb > div.P { border-color: var(--poly-line); } .jd .rb > div.K { border-color: var(--kalshi-line); }
  .jd .ex { font-size: 12px; margin: 2px 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } .col { border-right: 0; border-bottom: 1px solid var(--line); } th { position: static; } }
</style>
</head>
<body>
<header>
  <h1>Kalshi × Polymarket US</h1>
  <div class="tabs">
    <button id="t1" class="on" onclick="tab(1)">Markets</button>
    <button id="t2" onclick="tab(2)">Candidates</button>
    <button id="t3" onclick="tab(3)">Judge</button>
  </div>
  <div class="counts" id="counts"></div>
</header>

<section id="v1">
  <div class="bar">
    <select id="m_platform"><option value="">Both platforms</option><option value="KALSHI">Kalshi</option><option value="POLYUS">Polymarket US</option></select>
    <select id="m_category"><option value="">All categories</option></select>
    <select id="m_sport"><option value="">All sports</option></select>
    <select id="m_league"><option value="">All leagues</option></select>
    <select id="m_bet"><option value="">All bet types</option></select>
    <input type="text" id="m_q" placeholder="search title / market / uid">
    <label class="chk"><input type="checkbox" id="m_window"> closes within 7 days</label>
    <label class="chk"><input type="checkbox" id="m_scope"> NFL + NBA only</label>
    <button onclick="resetMarkets()">Clear</button>
    <span class="n" id="m_n"></span>
  </div>
  <table>
    <thead><tr><th>Platform</th><th>Category / sport / league</th><th>Event</th><th>Market</th><th>YES means</th><th>Bet type</th><th>Line</th><th>Game start</th><th>Closes</th></tr></thead>
    <tbody id="m_rows"></tbody>
  </table>
  <div class="pager" id="m_pager"></div>
</section>

<section id="v2" hidden>
  <div class="bar">
    <select id="p_source"><option value="">All candidate sets</option></select>
    <select id="p_league"><option value="">All leagues</option></select>
    <select id="p_map"><option value="">All bet types</option></select>
    <select id="p_direction"><option value="">Both directions</option><option value="same">same side</option><option value="opposite">opposite side</option></select>
    <select id="p_status"><option value="">Any status</option></select>
    <input type="text" id="p_q" placeholder="search titles / match key / pair id">
    <button onclick="resetPairs()">Clear</button>
    <span class="n" id="p_n"></span>
  </div>
  <table class="pairs">
    <thead><tr><th class="p">Polymarket US</th><th style="text-align:center">pair</th><th class="k">Kalshi</th></tr></thead>
    <tbody id="p_rows"></tbody>
  </table>
  <div class="pager" id="p_pager"></div>
</section>

<section id="v3" hidden>
  <div class="bar">
    <select id="j_source"><option value="">All candidate sets</option></select>
    <select id="j_league"><option value="">All leagues</option></select>
    <select id="j_verdict"><option value="">Any verdict</option></select>
    <input type="text" id="j_q" placeholder="search bet type / id / reasoning">
    <button onclick="resetJudge()">Clear</button>
    <span class="n" id="j_n"></span>
  </div>
  <table class="judge">
    <thead><tr><th></th><th>Verdict</th><th>Set · league · bet type</th><th title="How many Kalshi x Polymarket US market pairs share these two rule templates. One verdict covers all of them.">Market pairs covered</th><th>Opposite OK</th><th>Conf.</th><th>Judged by</th><th>Prompt</th><th>Human question</th></tr></thead>
    <tbody id="j_rows"></tbody>
  </table>
</section>

<div id="drawer">
  <div class="hd"><strong id="d_title"></strong><span id="d_meta" class="muted"></span><button onclick="closeDrawer()">close</button></div>
  <div class="cols">
    <div class="col P" id="d_p"></div>
    <div class="col K" id="d_k"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "" : Number(n).toLocaleString();
const ts = ms => ms == null ? "" : new Date(Number(ms)).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
const plat = p => p === "KALSHI" ? "K" : "P";
const platName = p => p === "KALSHI" ? "Kalshi" : "Polymarket US";
let state = { tab: 1, mpage: 1, ppage: 1, sel: null };
const debounce = (f, t) => { let h; return (...a) => { clearTimeout(h); h = setTimeout(() => f(...a), t); }; };

async function api(path, params) {
  const u = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params || {})) if (v !== "" && v != null && v !== false) u.searchParams.set(k, v === true ? "1" : v);
  const r = await fetch(u); return r.json();
}

function tab(n) { state.tab = n; for (const i of [1,2,3]) { $("v"+i).hidden = n !== i; $("t"+i).classList.toggle("on", n === i); } if (n === 2) loadPairs(); if (n === 3) loadJudge(); }

async function summary() {
  const s = await api("/api/summary");
  $("counts").innerHTML = `<span>open markets <span class="k">Kalshi ${fmt(s.markets.KALSHI)}</span> · <span class="p">Polymarket US ${fmt(s.markets.POLYUS)}</span></span>` +
    `<span>within 7 days <span class="k">${fmt(s.in_window.KALSHI)}</span> · <span class="p">${fmt(s.in_window.POLYUS)}</span></span>` +
    `<span>candidate pairs ${fmt(s.pairs)}</span><span>catalog ${ts(s.as_of.KALSHI)}</span>`;
  fillSelect($("p_source"), s.pair_sources.map(v => ({v, n: null})), "All candidate sets");
}

function fillSelect(sel, opts, first) {
  const cur = sel.value;
  sel.innerHTML = `<option value="">${esc(first)}</option>` + opts.map(o => `<option value="${esc(o.v)}">${esc(o.v)}${o.n != null ? " (" + fmt(o.n) + ")" : ""}</option>`).join("");
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

// ------------------------------------------------------------ tab 1
function marketParams() {
  const league = $("m_scope").checked ? ($("m_league").value && ["nfl","nba"].includes($("m_league").value) ? $("m_league").value : "nfl,nba") : $("m_league").value;
  return { platform: $("m_platform").value, category: $("m_category").value, sport: $("m_sport").value, league,
           bet: $("m_bet").value, q: $("m_q").value, window: $("m_window").checked, page: state.mpage, size: 100 };
}
async function loadMarkets() {
  const d = await api("/api/markets", marketParams());
  fillSelect($("m_category"), d.options.category, "All categories");
  fillSelect($("m_sport"), d.options.sport, "All sports");
  fillSelect($("m_league"), d.options.league, "All leagues");
  fillSelect($("m_bet"), d.options.bet_type, "All bet types");
  $("m_n").innerHTML = `${fmt(d.total)} markets · <span class="k">${fmt(d.by_platform.KALSHI)}</span> / <span class="p">${fmt(d.by_platform.POLYUS)}</span>`;
  $("m_rows").innerHTML = d.rows.map(r => `<tr class="${plat(r.platform)}">
    <td><span class="pill ${plat(r.platform)}">${platName(r.platform)}</span><div class="mono muted">${esc(r.market_uid)}</div></td>
    <td>${esc(r.category)}<div class="sub">${esc([r.sport, r.league].filter(Boolean).join(" · "))}</div></td>
    <td>${esc(r.event_title)}</td>
    <td>${r.market_url ? `<a href="${esc(r.market_url)}" target="_blank" style="color:inherit">${esc(r.market)}</a>` : esc(r.market)}</td>
    <td>${esc(r.yes)}</td><td class="sub">${esc(r.bet_type)}</td><td>${r.line == null ? "" : r.line}</td>
    <td class="sub">${ts(r.game_start_ms)}</td><td class="sub">${ts(r.close_ms)}</td></tr>`).join("");
  pager($("m_pager"), d, p => { state.mpage = p; loadMarkets(); });
}
function pager(el, d, go) {
  const last = Math.max(1, Math.ceil(d.total / d.size));
  el.innerHTML = `<button ${d.page <= 1 ? "disabled" : ""} id="pg_prev">‹ prev</button><span>page ${d.page} of ${fmt(last)}</span><button ${d.page >= last ? "disabled" : ""} id="pg_next">next ›</button>`;
  el.querySelector("#pg_prev").onclick = () => go(d.page - 1);
  el.querySelector("#pg_next").onclick = () => go(d.page + 1);
}
function resetMarkets(reload = true) { for (const id of ["m_platform","m_category","m_sport","m_league","m_bet"]) $(id).value = ""; $("m_q").value = ""; $("m_window").checked = false; $("m_scope").checked = false; state.mpage = 1; if (reload) loadMarkets(); }
for (const id of ["m_platform","m_category","m_sport","m_league","m_bet","m_window","m_scope"]) $(id).addEventListener("change", () => { state.mpage = 1; loadMarkets(); });
$("m_q").addEventListener("input", debounce(() => { state.mpage = 1; loadMarkets(); }, 250));

// ------------------------------------------------------------ tab 2
function pairParams() {
  return { source: $("p_source").value, league: $("p_league").value, map_key: $("p_map").value, direction: $("p_direction").value,
           status: $("p_status").value, q: $("p_q").value, page: state.ppage, size: 100 };
}
async function loadPairs() {
  const d = await api("/api/pairs", pairParams());
  fillSelect($("p_league"), d.options.league || [], "All leagues");
  fillSelect($("p_map"), d.options.map_key || [], "All bet types");
  fillSelect($("p_status"), d.options.status || [], "Any status");
  $("p_n").textContent = `${fmt(d.total)} pairs`;
  $("p_rows").innerHTML = d.rows.map(r => `<tr class="pair ${r.pair_id === state.sel ? "sel" : ""}" data-id="${esc(r.pair_id)}">
    <td class="side P"><div>${esc(r.polyus_title)}</div><div class="sub">YES = <b>${esc(r.polyus_yes)}</b></div><div class="mono muted">${esc(r.polyus_market_uid)}</div></td>
    <td class="mid"><span class="pill ${esc(r.direction)}">${esc(r.direction)}</span><div class="sub">${esc(r.league)} · ${esc(r.map_key)}</div><div class="sub">${ts(r.event_time_ms)}</div><span class="pill st">${esc(r.status)}</span></td>
    <td class="side K"><div>${esc(r.kalshi_title)}</div><div class="sub">YES = <b>${esc(r.kalshi_yes)}</b></div><div class="mono muted">${esc(r.kalshi_market_uid)}</div></td></tr>`).join("");
  for (const tr of $("p_rows").querySelectorAll("tr.pair")) tr.onclick = () => openPair(tr.dataset.id);
  pager($("p_pager"), d, p => { state.ppage = p; loadPairs(); });
}
function resetPairs() { for (const id of ["p_source","p_league","p_map","p_direction","p_status"]) $(id).value = ""; $("p_q").value = ""; state.ppage = 1; loadPairs(); }
for (const id of ["p_source","p_league","p_map","p_direction","p_status"]) $(id).addEventListener("change", () => { state.ppage = 1; loadPairs(); });
$("p_q").addEventListener("input", debounce(() => { state.ppage = 1; loadPairs(); }, 250));

async function openPair(id) {
  state.sel = id;
  for (const tr of $("p_rows").querySelectorAll("tr.pair")) tr.classList.toggle("sel", tr.dataset.id === id);
  const d = await api("/api/pair", { id });
  $("d_title").textContent = `${d.league} · ${d.map_key} · ${d.direction}`;
  $("d_meta").textContent = `${d.match_key}   template ${d.template_pair_id}   ${d.status}`;
  const side = (s, name) => !s ? `<h3>${name}</h3><p class="muted">market not in the current catalog</p>` :
    `<h3>${name}</h3><dl><dt>event</dt><dd>${esc(s.event_title)}</dd><dt>market</dt><dd>${esc(s.market)}</dd><dt>YES</dt><dd>${esc(s.yes)}</dd>` +
    (s.no ? `<dt>NO</dt><dd>${esc(s.no)}</dd>` : "") + `<dt>bet type</dt><dd>${esc(s.bet_type)}${s.line != null ? " · line " + s.line : ""}</dd>` +
    `<dt>game</dt><dd>${ts(s.game_start_ms)}</dd><dt>closes</dt><dd>${ts(s.close_ms)}</dd>` + (s.url ? `<dt>link</dt><dd><a href="${esc(s.url)}" target="_blank" style="color:inherit">${esc(s.url)}</a></dd>` : "") +
    `</dl><div class="rules">${esc(s.rules || "(no rules text)")}</div>`;
  $("d_p").innerHTML = side(d.polyus, "Polymarket US");
  $("d_k").innerHTML = side(d.kalshi, "Kalshi");
  $("drawer").classList.add("open");
}
function closeDrawer() { $("drawer").classList.remove("open"); }

// ------------------------------------------------------------ tab 3
const vpill = v => `<span class="pill ${esc(v.startsWith("human:") ? "identical" : v)}">${esc(v)}</span>`;
const oppTxt = o => o === true ? "yes" : o === false ? "no" : "—";
async function loadJudge() {
  const d = await api("/api/templates", { source: $("j_source").value, league: $("j_league").value, verdict: $("j_verdict").value, q: $("j_q").value });
  fillSelect($("j_source"), d.options.source || [], "All candidate sets");
  fillSelect($("j_league"), d.options.league || [], "All leagues");
  fillSelect($("j_verdict"), d.options.verdict || [], "Any verdict");
  $("j_n").textContent = `${fmt(d.total)} template pairs`;
  $("j_rows").innerHTML = d.rows.map(r => `<tr class="jrow" data-id="${esc(r.template_pair_id)}" data-source="${esc(r.source)}">
    <td>▸</td><td>${vpill(r.verdict)}</td>
    <td>${esc(r.source)} · ${esc(r.league)}<div class="sub">${esc(r.map_key)} · <span class="mono">${esc(r.template_pair_id)}</span></div></td>
    <td>${fmt(r.n_pairs)}<div class="sub">${esc(r.status)}</div></td>
    <td>${oppTxt(r.opposite_side_ok)}</td><td>${r.confidence == null ? "" : r.confidence}</td>
    <td class="sub">${esc(r.reviewed_by || "")}<div>${esc(r.date || "")}</div></td><td class="sub mono">${esc(r.prompt_version || "")}</td>
    <td class="sub">${esc(r.human_review_question || "")}</td></tr>`).join("");
  for (const tr of $("j_rows").querySelectorAll("tr.jrow")) tr.onclick = () => toggleJudge(tr);
}
async function toggleJudge(tr) {
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("jdetail")) { next.remove(); tr.firstElementChild.textContent = "▸"; return; }
  const d = await api("/api/template", { id: tr.dataset.id, source: tr.dataset.source });
  const chk = (d.checklist || []).map(c => `<tr><td class="dim">${esc(c.dimension)}</td><td class="same-${esc(c.same)}">${esc(c.same)}</td><td>${esc(c.kalshi)}</td><td>${esc(c.polyus)}</td><td class="muted">${esc(c.note)}</td></tr>`).join("");
  const ex = (d.examples || []).map(e => `<div class="ex"><span class="pill ${esc(e.direction)}">${esc(e.direction)}</span> <span class="k">${esc(e.kalshi_title)}</span> (YES = ${esc(e.kalshi_yes)}) &nbsp;↔&nbsp; <span class="p">${esc(e.polyus_title)}</span> (YES = ${esc(e.polyus_yes)}) <span class="muted">${ts(e.event_time_ms)}</span></div>`).join("");
  const det = document.createElement("tr"); det.className = "jdetail";
  det.innerHTML = `<td colspan="9"><div class="jd">
    <h4>Verdict</h4><div>${vpill(d.verdict)} &nbsp; opposite side ok: <b>${oppTxt(d.opposite_side_ok)}</b> &nbsp; confidence <b>${d.confidence ?? "—"}</b> &nbsp; <span class="muted">${esc(d.reviewed_by || "")} · ${esc(d.prompt_version || "")} · ${esc(d.date || "")}</span>
      &nbsp; <span class="muted">covers ${fmt(d.n_pairs)} market pairs; ${d.enabled_pairs ? `${fmt(d.enabled_pairs)} enabled in candidate_pairs: ${esc(JSON.stringify(d.status_counts))}` : "bet type not enabled in this league's BETS yet"}</span></div>
    <div class="sub" style="margin-top:6px">One row per <b>template pair</b>: one Kalshi rules wording × one Polymarket US rules wording. The same bet type appears on several rows when the wording differs (Kalshi "(Protected)" vs regular series, "+" vs "−" spread text, tie markets vs team markets).</div>
    <h4>Reasoning</h4><div class="reason">${esc(d.reasoning || "(no verdict on file)")}</div>
    ${d.human_review_question ? `<h4>Question for a human</h4><div class="reason">${esc(d.human_review_question)}</div>` : ""}
    ${chk ? `<h4>Checklist</h4><table class="chk"><thead><tr><th>Dimension</th><th>Same?</th><th class="k">Kalshi says</th><th class="p">Polymarket US says</th><th>Note</th></tr></thead><tbody>${chk}</tbody></table>` : ""}
    <h4>Example pairs the judge saw</h4>${ex || '<div class="muted">none</div>'}
    <h4>Rulebooks (first pair's markets)</h4><div class="rb"><div class="P"><b class="p">Polymarket US</b>\n\n${esc(d.polyus_example)}</div><div class="K"><b class="k">Kalshi</b>\n\n${esc(d.kalshi_example)}</div></div>
    <h4>Templates (what makes these pairs one group)</h4><div class="rb"><div class="P">${esc(d.polyus_template)}</div><div class="K">${esc(d.kalshi_template)}</div></div>
  </div></td>`;
  tr.after(det); tr.firstElementChild.textContent = "▾";
}
function resetJudge() { for (const id of ["j_source","j_league","j_verdict"]) $(id).value = ""; $("j_q").value = ""; loadJudge(); }
for (const id of ["j_source","j_league","j_verdict"]) $(id).addEventListener("change", loadJudge);
$("j_q").addEventListener("input", debounce(loadJudge, 250));
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

summary(); loadMarkets();
</script>
</body>
</html>
