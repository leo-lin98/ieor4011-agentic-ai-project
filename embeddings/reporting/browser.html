<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event comparison</title><link rel="stylesheet" href="/browser.css"></head>
<body><main>
<header class="page-header"><div><h1>Event comparison</h1><p id="direction"></p></div><a href="/contracts">Search the collection →</a></header>
<section class="summary" aria-labelledby="summary-heading"><div><h2 id="summary-heading">Your review progress</h2><p id="review-progress" role="status">Loading reviews…</p><small>Saved in this browser. Download a backup when you finish.</small></div><button id="export-event-reviews" type="button">Download CSV</button></section>
<section class="evaluation" aria-labelledby="evaluation-heading">
  <h2 id="evaluation-heading">Random evaluation set</h2>
  <form id="sample-form" class="sample-controls">
    <label>Events<input type="number" name="size" min="1" max="100" value="20" required></label>
    <label>Sampling<select name="method"><option value="uniform">Uniform random</option><option value="volume">Weighted by volume</option></select></label>
    <label>Categories<select name="category"><option value="non-sports">Non-sports</option><option value="sports">Sports</option><option value="all">All categories</option></select></label>
    <button class="primary" type="submit" disabled>Create evaluation set</button>
  </form>
  <small id="sampling-note">Sets and reviews are saved in this browser.</small>
  <p id="sample-error" role="alert"></p>
  <label id="sample-picker-label" hidden>Saved evaluation sets<select id="sample-picker"></select></label>
  <div id="sample-review"></div>
</section>
<form class="filters" id="filters"><label>Category<select id="category" name="category"><option value="non-sports">Non-sports</option><option value="sports">Sports</option><option value="all">All categories</option><option value="unknown">Unclassified</option></select></label><label>Search events<input type="search" name="search" placeholder="Title or event ID"></label><label>Minimum volume<input type="number" name="minimum" min="0" step="any" placeholder="Any"></label><label>Sort by<select name="sort"><option value="volume">Highest volume</option><option value="volume_asc">Lowest volume</option><option value="title">Event title</option><option value="score">Top match score</option></select></label><button class="primary" type="submit">Apply filters</button></form>
<div class="results-heading"><h2 id="events-heading">Query events</h2><p id="status" role="status" aria-live="polite">Loading events…</p></div><p id="error" role="alert"></p><div id="events" class="event-list"></div>
<nav class="pagination" aria-label="Results pages"><button id="previous" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></nav>
<p class="notice" id="notice">Similarity scores are suggestions for review.</p>
</main><script src="/browser.js"></script></body></html>
