<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classification review</title><link rel="stylesheet" href="/browser.css"><style>body{max-width:1000px;margin:auto;padding:1rem}article{border:1px solid #ccc;border-radius:8px;padding:1rem;margin:1rem 0}label{display:block;margin:.6rem 0}select,textarea{display:block;width:100%;max-width:600px}textarea{min-height:4em}pre{white-space:pre-wrap;overflow-wrap:anywhere}.warning{color:#a32}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.4rem}</style></head><body><main><p><a href="/">← Retrieval evaluator</a></p><h1>Classification review</h1><label>Run <select id="runs"><option value="">Select a run</option></select></label><p id="error" role="alert"></p><section id="view" hidden><h2 id="query"></h2><p id="position"></p><button id="prev">Previous event</button> <button id="next">Next event</button><div id="candidates"></div><h2>Results</h2><p id="summary"></p><p>Only judgments explicitly made for this run and its label definitions are scored. Changed inputs, unresolved conflicts, and historical judgments of uncertain definition are excluded.</p><div id="matrix"></div></section></main><script>
'use strict'; const $=s=>document.querySelector(s); let run,index=0; const el=(tag,text)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
async function get(url){let r=await fetch(url);if(!r.ok)throw Error(await r.text());return r.json()}
async function load(){run=await get('/api/classification/run?'+new URLSearchParams({id:$('#runs').value}));render()}
function render(){let e=run.manifest.events[index],start=run.manifest.events.slice(0,index).reduce((a,x)=>a+x.candidates.length,0);$('#view').hidden=false;$('#query').textContent=e.title||e.event_uid;$('#position').textContent=`Event ${index+1} of ${run.manifest.events.length}`;$('#prev').disabled=index===0;$('#next').disabled=index===run.manifest.events.length-1;let container=$('#candidates');container.replaceChildren();
 e.candidates.forEach((c,i)=>{let p=run.results[start+i],card=el('article');card.append(el('h3',`${c.rank||i+1}. ${c.candidate_title||c.candidate_uid}`),el('p',`Prediction: ${p.label||p.status} · Review: ${p.state}`));if(p.state!=='reviewed')card.append(Object.assign(el('p',p.state==='conflicts'?'Conflicting judgments require an explicit review.':p.state==='changed_input'?'The reviewed input differs from this run.':p.state==='incompatible'?'Earlier judgment has an uncertain or different label definition.':''),{className:'warning'}));card.append(el('pre',JSON.stringify(p.input,null,2)));if(p.reviews.length){let details=el('details'),summary=el('summary',`Previous judgments (${p.reviews.length})`);details.append(summary);for(let r of p.reviews)details.append(el('pre',JSON.stringify({label:r.label,note:r.note,input:r.input?JSON.parse(r.input):null,reviewed_at:r.reviewed_at,provenance:r.provenance},null,2)));card.append(details)}let label=el('label','Judgment'),select=el('select');select.append(new Option('Select a label',''));for(let l of run.config.labels)select.append(new Option(l,l));label.append(select);let noteLabel=el('label','Note'),note=el('textarea');noteLabel.append(note);let save=el('button','Save judgment');save.onclick=async()=>{try{let response=await fetch('/api/classification/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_id:run.id,pair_id:p.id,label:select.value,note:note.value})});if(!response.ok)throw Error(await response.text());await load();$('#error').textContent=''}catch(e){$('#error').textContent=e.message}};card.append(label,noteLabel,save);container.append(card)});
 let c=run.counts;$('#summary').textContent=`Scored: ${c.scored}; correct: ${c.correct}${c.scored?' ('+(100*c.correct/c.scored).toFixed(1)+'%)':''}. Failed: ${c.failed}; refused: ${c.refused}; missing predictions: ${c.missing_prediction}; missing reviews: ${c.missing_review}; changed inputs: ${c.changed_input}; conflicts: ${c.conflicts}; incompatible reviews: ${c.incompatible}.`;let table=el('table'),head=el('tr');head.append(el('th','Human / predicted'));for(let l of run.config.labels)head.append(el('th',l));table.append(head);for(let l of run.config.labels){let row=el('tr');row.append(el('th',l));for(let p of run.config.labels)row.append(el('td',String(run.matrix[l]?.[p]||0)));table.append(row)}$('#matrix').replaceChildren(table)}
$('#runs').onchange=async()=>{index=0;if(!$('#runs').value){$('#view').hidden=true;return}try{await load()}catch(e){$('#error').textContent=e.message}};$('#prev').onclick=()=>{index--;render()};$('#next').onclick=()=>{index++;render()};get('/api/classification/runs').then(d=>{for(let r of d.runs)$('#runs').append(new Option(`${r.id} · ${r.provenance||r.created_at||'unknown origin'}`,r.id))}).catch(e=>$('#error').textContent=e.message);
</script></body></html>
